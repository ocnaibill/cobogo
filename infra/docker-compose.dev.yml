services:
  # PostgreSQL interno do Cobogó: metadados, análises, deploys, jobs e
  # eventos (DEC-03, DEC-21). Bancos auxiliares de projetos são isolados
  # por projeto e não entram aqui (§14.1 do mestre).
  postgres:
    image: postgres:15-alpine
    container_name: cobogo-db
    environment:
      POSTGRES_USER: cobogo
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: cobogo_core
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
