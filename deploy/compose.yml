# Cobogó na VM (DEC-32). Uso:
#   cp deploy/.env.example deploy/.env   # e preencha
#   docker compose --env-file deploy/.env -f deploy/compose.yml up -d --build
#   # com o túnel da Cloudflare:  ... --profile tunnel up -d --build
#
# Nada aqui publica porta no host: o acesso vem pelo túnel (ou, nos testes
# locais, pelo arquivo compose.local.yml). Só o proxy monta o socket do Docker.
name: cobogo

x-api-build: &api-build
  context: ..
  dockerfile: deploy/Dockerfile.api

x-hardened: &hardened
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    restart: unless-stopped
    environment:
      POSTGRES_USER: cobogo
      POSTGRES_DB: cobogo_core
      # O superusuário só serve ao script de criação dos roles (DEC-33).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      COBOGO_OWNER_PASSWORD: ${COBOGO_OWNER_PASSWORD:?defina COBOGO_OWNER_PASSWORD}
      COBOGO_API_PASSWORD: ${COBOGO_API_PASSWORD:?defina COBOGO_API_PASSWORD}
      COBOGO_WORKER_PASSWORD: ${COBOGO_WORKER_PASSWORD:?defina COBOGO_WORKER_PASSWORD}
      COBOGO_COLLECTOR_PASSWORD: ${COBOGO_COLLECTOR_PASSWORD:?defina COBOGO_COLLECTOR_PASSWORD}
      COBOGO_BACKUP_PASSWORD: ${COBOGO_BACKUP_PASSWORD:?defina COBOGO_BACKUP_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/10-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    # O Postgres precisa trocar de dono e de usuário na inicialização.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cobogo -d cobogo_core"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [control]

  # O único serviço com o socket do Docker. Filtra por método e prefixo de
  # caminho: libera só o que o worker usa (DEC-32 item 2).
  docker-proxy:
    image: tecnativa/docker-socket-proxy@sha256:be1ac64f33bd82043beb504822a17ba6b71668ea1ad7cf51a9a01d27bb7ab047
    <<: *hardened
    environment:
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      BUILD: 1
      POST: 1
      EXEC: 0
      # DEC-41: volumes de dados. O worker só cria, mede, monta e remove os que têm
      # os labels do Cobogó (no código dele; o proxy não filtra por label).
      VOLUMES: 1
      SERVICES: 0
      SWARM: 0
      SECRETS: 0
      CONFIGS: 0
      AUTH: 0
      PLUGINS: 0
      NODES: 0
      TASKS: 0
      SESSION: 0
      DISTRIBUTION: 0
      # Só para medir o tamanho dos volumes (GET /system/df).
      SYSTEM: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    tmpfs: ["/tmp", "/run", "/var/lib/haproxy"]
    # O haproxy do proxy começa como root para abrir o socket.
    user: "0:0"
    cap_drop: [ALL]
    mem_limit: 128m
    networks: [control]

  # O proxy do Docker **só de leitura** do coletor (DEC-43, DEC-19): lista,
  # inspeciona e lê estatísticas dos contêineres; não cria, não para, não remove,
  # não constrói e não mexe em imagens, volumes nem redes.
  docker-proxy-ro:
    image: tecnativa/docker-socket-proxy@sha256:be1ac64f33bd82043beb504822a17ba6b71668ea1ad7cf51a9a01d27bb7ab047
    <<: *hardened
    environment:
      CONTAINERS: 1
      POST: 0
      EXEC: 0
      IMAGES: 0
      NETWORKS: 0
      VOLUMES: 0
      BUILD: 0
      SERVICES: 0
      SWARM: 0
      SECRETS: 0
      CONFIGS: 0
      AUTH: 0
      PLUGINS: 0
      NODES: 0
      TASKS: 0
      SESSION: 0
      DISTRIBUTION: 0
      SYSTEM: 0
      INFO: 0
      EVENTS: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    tmpfs: ["/tmp", "/run", "/var/lib/haproxy"]
    user: "0:0"
    cap_drop: [ALL]
    mem_limit: 64m
    networks: [control]

  # Aplica as migrations e os privilégios com o role dono, uma vez, antes de a API
  # e o worker subirem (DEC-33). Só ele tem permissão de DDL.
  migrate:
    build: *api-build
    <<: *hardened
    restart: "no"
    command: ["migrate"]
    environment:
      DATABASE_URL: postgres://cobogo_owner:${COBOGO_OWNER_PASSWORD}@postgres:5432/cobogo_core?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 128m
    networks: [control]

  # Rotação da chave das variáveis (DEC-39): só sob demanda, com o role dono, que
  # é o único que pode reescrever o texto cifrado. Não sobe com `up`:
  #   docker compose --env-file deploy/.env -f deploy/compose.yml --profile tools run --rm rotate-secrets [--check]
  rotate-secrets:
    build: *api-build
    <<: *hardened
    restart: "no"
    profiles: [tools]
    # `run ... rotate-secrets --check` substitui o `command`; o subcomando fica no entrypoint.
    entrypoint: ["/usr/local/bin/cobogo-api", "rotate-secrets"]
    environment:
      DATABASE_URL: postgres://cobogo_owner:${COBOGO_OWNER_PASSWORD}@postgres:5432/cobogo_core?sslmode=disable
      COBOGO_SECRET_KEY: ${COBOGO_SECRET_KEY:-}
      COBOGO_SECRET_KEYS: ${COBOGO_SECRET_KEYS:-}
      COBOGO_SECRET_KEY_CURRENT: ${COBOGO_SECRET_KEY_CURRENT:-}
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 128m
    networks: [control]

  api:
    build: *api-build
    <<: *hardened
    environment:
      DATABASE_URL: postgres://cobogo_api:${COBOGO_API_PASSWORD}@postgres:5432/cobogo_core?sslmode=disable
      COBOGO_AUTO_MIGRATE: "0"
      COBOGO_SECRET_KEY: ${COBOGO_SECRET_KEY:-}
      COBOGO_SECRET_KEYS: ${COBOGO_SECRET_KEYS:-}
      COBOGO_SECRET_KEY_CURRENT: ${COBOGO_SECRET_KEY_CURRENT:-}
      COBOGO_PUBLIC_URL: ${COBOGO_PUBLIC_URL:?defina COBOGO_PUBLIC_URL}
      COBOGO_COOKIE_INSECURE: ${COBOGO_COOKIE_INSECURE:-0}
      # Só o Traefik, na rede de roteamento, pode informar o IP do cliente.
      COBOGO_TRUSTED_PROXIES: ${COBOGO_ROUTING_SUBNET:-172.30.20.0/24}
      COBOGO_ROUTER_TOKEN: ${COBOGO_ROUTER_TOKEN:?defina COBOGO_ROUTER_TOKEN}
      COBOGO_ROUTER_ADDR: ":8081"
      COBOGO_PANEL_TARGET: http://api:8080
      COBOGO_APPS_DOMAIN: ${COBOGO_APPS_DOMAIN:-}
      COBOGO_APPS_SCHEME: ${COBOGO_APPS_SCHEME:-https}
      # Os backups da plataforma só se leem aqui (DEC-47); quem os escreve é o serviço backup.
      COBOGO_BACKUP_DIR: /backups
    volumes:
      - backups:/backups:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    depends_on:
      migrate:
        condition: service_completed_successfully
    # O argon2id usa 64 MiB por verificação de senha (até 2 ao mesmo tempo, DEC-27);
    # 256 MiB bastou até um login concorrente com o `admin reset-password` ser
    # morto pelo kernel (verificado na VM). O comando de administração deve rodar
    # em contêiner próprio (`docker compose run --rm api admin ...`).
    mem_limit: 512m
    networks: [control, routing]

  # O coletor de métricas (DEC-43): processo próprio, em laço independente dos
  # builds. Lê o Docker só pelo proxy de leitura e escreve só as amostras, com o
  # seu role. A sonda de rota passa pelo Traefik, sem entrar nas redes dos projetos.
  collector:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.collector
    <<: *hardened
    environment:
      DOCKER_HOST: tcp://docker-proxy-ro:2375
      DATABASE_URL: postgres://cobogo_collector:${COBOGO_COLLECTOR_PASSWORD:?defina COBOGO_COLLECTOR_PASSWORD}@postgres:5432/cobogo_core?sslmode=disable
      COBOGO_AUTO_MIGRATE: "0"
      COBOGO_COLLECTOR_INTERVAL: ${COBOGO_COLLECTOR_INTERVAL:-5s}
      COBOGO_ROUTES_URL: http://api:8081/traefik/config
      COBOGO_ROUTER_TOKEN: ${COBOGO_ROUTER_TOKEN:?defina COBOGO_ROUTER_TOKEN}
      COBOGO_PROBE_URL: http://traefik:8000
    depends_on:
      migrate:
        condition: service_completed_successfully
      docker-proxy-ro:
        condition: service_started
    mem_limit: 128m
    networks: [control, routing]

  # O backup do banco interno (DEC-47): todo dia às 03:00 (COBOGO_BACKUP_AT, no fuso
  # do contêiner), um dump consistente num volume próprio, com um role só de leitura.
  # A chave das variáveis NÃO entra aqui: o dump leva os segredos cifrados e a chave
  # se guarda à parte. Um backup agora: `docker compose ... run --rm backup once pre-x`.
  backup:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backup
    <<: *hardened
    environment:
      DATABASE_URL: postgres://cobogo_backup:${COBOGO_BACKUP_PASSWORD:?defina COBOGO_BACKUP_PASSWORD}@postgres:5432/cobogo_core?sslmode=disable
      COBOGO_BACKUP_DIR: /backups
      COBOGO_BACKUP_AT: ${COBOGO_BACKUP_AT:-03:00}
      TZ: ${COBOGO_BACKUP_TZ:-UTC}
    volumes:
      - backups:/backups
    depends_on:
      migrate:
        condition: service_completed_successfully
    mem_limit: 256m
    networks: [control]

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
    <<: *hardened
    environment:
      DOCKER_HOST: tcp://docker-proxy:2375
      DATABASE_URL: postgres://cobogo_worker:${COBOGO_WORKER_PASSWORD}@postgres:5432/cobogo_core?sslmode=disable
      COBOGO_AUTO_MIGRATE: "0"
      COBOGO_SECRET_KEY: ${COBOGO_SECRET_KEY:-}
      COBOGO_SECRET_KEYS: ${COBOGO_SECRET_KEYS:-}
      COBOGO_SECRET_KEY_CURRENT: ${COBOGO_SECRET_KEY_CURRENT:-}
      # Dentro de um contêiner a porta publicada no host não é alcançável: a
      # sonda fala com a aplicação pelo nome, na rede do projeto (DEC-32 item 5).
      COBOGO_PROBE: network
      COBOGO_APPS_DOMAIN: ${COBOGO_APPS_DOMAIN:-}
      COBOGO_APPS_SCHEME: ${COBOGO_APPS_SCHEME:-https}
    # O workspace de clonagem: só aqui o worker escreve.
    tmpfs: ["/tmp:size=4g,mode=1777"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      docker-proxy:
        condition: service_started
    mem_limit: 1g
    networks: [control]

  traefik:
    image: traefik@sha256:31267173a15b4944e797a76ffd9c419707c8d8b32fe5b610f80cd0cfa05f372d
    <<: *hardened
    # Sem root e sem capacidades: escuta em 8000, acima das portas privilegiadas.
    user: "65532:65532"
    command:
      - --providers.http.endpoint=http://api:8081/traefik/config
      - --providers.http.pollInterval=2s
      - --providers.http.pollTimeout=5s
      - --providers.http.headers.Authorization=Bearer ${COBOGO_ROUTER_TOKEN:?defina COBOGO_ROUTER_TOKEN}
      - --entrypoints.web.address=:8000
      - --api.dashboard=false
      - --log.level=INFO
      - --accesslog=false
    mem_limit: 256m
    networks: [routing, ingress]

  cloudflared:
    image: cloudflare/cloudflared@sha256:e613aadbc2d9511785d2e67a86b0c8ac18dd63a3f9af0d06faf04cbfdcb35f2d
    profiles: [tunnel]
    <<: *hardened
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    mem_limit: 128m
    networks: [ingress]

networks:
  control:
    name: cobogo-control
  routing:
    name: cobogo-routing
    ipam:
      config:
        - subnet: ${COBOGO_ROUTING_SUBNET:-172.30.20.0/24}
  ingress:
    name: cobogo-ingress

volumes:
  postgres_data:
  # Os backups da plataforma (DEC-47). Fica na mesma VM: só protege de erro, não de
  # perda do disco; a cópia de fora se baixa pelo painel.
  backups:
