          format: uuid
        project_id:
          type: string
          format: uuid
        reason:
          type: string
          enum: [manual, before_delete, before_restore]
        pause_app:
          type: boolean
        state:
          type: string
          enum: [queued, running, succeeded, failed]
        error:
          type: string
        size_bytes:
          type: integer
          format: int64
        manifest:
          $ref: '#/components/schemas/BackupManifest'
        delete_requested:
          type: boolean
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
    ProjectBackupsView:
      type: object
      required: [backups, configured, has_content, keep, restores]
      properties:
        backups:
          type: array
          items:
            $ref: '#/components/schemas/ProjectBackup'
        configured:
          type: boolean
          description: O painel enxerga o volume de backups.
        has_content:
          type: boolean
          description: O projeto tem o que copiar (caminho persistente ou banco gerenciado).
        keep:
          type: integer
          description: Quantos backups o projeto guarda.
        restores:
          type: array
          description: As restaurações mais recentes, a em andamento primeiro (com o passo).
          items:
            $ref: '#/components/schemas/ProjectRestore'
    RestoreResult:
      type: object
      required: [volumes, database, skipped, warnings, app_restarted]
      properties:
        volumes:
          type: array
          items:
            type: string
        database:
          type: boolean
        skipped:
          type: array
          description: O que o backup tinha e não foi restaurado, com o motivo.
          items:
            type: string
        warnings:
          type: array
          items:
            type: string
        app_restarted:
          type: boolean
    ProjectRestore:
      type: object
      required: [id, project_id, backup_id, safety_backup_id, state, step, result, created_at, started_at, finished_at]
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        backup_id:
          type: string
          format: uuid
        safety_backup_id:
          type: string
          format: uuid
        state:
          type: string
          enum: [queued, running, succeeded, failed]
        step:
          type: string
          description: Em que passo está, enquanto roda (conferindo o backup, pausando a aplicação, restaurando o volume, restaurando o banco, iniciando a aplicação).
        error:
          type: string
        result:
          $ref: '#/components/schemas/RestoreResult'
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
    CommandsView:
      type: object
      required: [commands, scripts, available, reauth_until, default_timeout, max_timeout]
      properties:
        commands:
          type: array
          items:
            $ref: '#/components/schemas/Command'
        scripts:
          type: array
          items:
            $ref: '#/components/schemas/ScriptOption'
        available:
          type: boolean
        reason:
          type: string
        reauth_until:
          type: string
          format: date-time
          nullable: true
        default_timeout:
          type: integer
        max_timeout:
          type: integer
    ServiceNeed:
      type: object
      required: [engine, level, variable, reason, evidence]
      properties:
        engine:
          type: string
          enum: [postgres]
        level:
          type: string
          enum: [required, possible]
          description: |
            `required`: código de runtime usa a engine (a pergunta bloqueia o
            deploy antes do build). `possible`: só a dependência (vira sugestão).
        variable:
          type: string
          description: A variável principal (a URL, ou a senha no estilo partes).
        style:
          type: string
          enum: [url, parts]
          description: Como o código lê a conexão (DEC-44).
        family:
          type: string
          description: No estilo partes, o prefixo da família (`POSTGRES`, `PG`, `DB`...).
        variables:
          type: object
          description: Os nomes de variável por papel (`url`, ou `host`, `port`, `user`, `password`, `database`, e `ca`).
          additionalProperties:
            type: string
        reason:
          type: string
        evidence:
          type: array
          items:
            type: string
    Service:
      type: object
      required: [id, project_id, engine, mode, variable, variables, tls, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        engine:
          type: string
          enum: [postgres]
        mode:
          type: string
          enum: [managed, external, none]
        variable:
          type: string
        variables:
          type: object
          description: Os nomes de variável vinculados, por papel (DEC-44). `ca` é entregue na execução.
          additionalProperties:
            type: string
        tls:
          type: boolean
          description: O banco gerenciado aceita TLS, com certificado próprio (DEC-44). Bancos criados antes não têm.
        container_name:
          type: string
        volume_name:
          type: string
        status:
          type: string
          enum: [pending, ready, failed, deleting]
        status_detail:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    DatabaseView:
      type: object
      required: [need, service, variable, volume]
      properties:
        need:
          allOf:
            - $ref: '#/components/schemas/ServiceNeed'
          nullable: true
        service:
          allOf:
            - $ref: '#/components/schemas/Service'
          nullable: true
        variable:
          type: string
        volume:
          allOf:
            - $ref: '#/components/schemas/ProjectVolume'
          nullable: true
    PersistentSuggestion:
      type: object
      required: [path, kind, confidence, reason, evidence]
      properties:
        path:
          type: string
          description: |
            Caminho no contêiner. Vazio quando o código usa disco mas não se
            achou onde: a pessoa informa.
        kind:
          type: string
          enum: [sqlite, write_dir]
        confidence:
          type: string
          enum: [strong, weak]
        reason:
          type: string
        evidence:
          type: array
          items:
            type: string
          description: Arquivos e linhas em que a sugestão se apoia.
    PersistentView:
      type: object
      required: [paths, volumes, suggestions]
      properties:
        suggestions:
          type: array
          description: |
            Pistas da última análise para caminhos ainda não declarados. Só
            sugerem; quem declara é o usuário (`PUT .../persistent-paths`).
          items:
            $ref: '#/components/schemas/PersistentSuggestion'

        paths:
          type: array
          items:
            type: string
        volumes:
          type: array
          items:
            $ref: '#/components/schemas/ProjectVolume'
    Plan:
      type: object
      required: [profile, runtime, build_image, package_manager, install_command, start_command, execution_mode, port, port_origin, health_path, dockerfile]
      properties:
        profile:
          type: string
          enum: [P-NODE, P-BUN, P-STATIC, P-PY]
        runtime:
          type: string
        build_image:
          type: string
        node_version:
          type: string
          description: Só no perfil P-NODE.
        bun_version:
          type: string
          description: Tag da imagem oven/bun; só no perfil P-BUN (DEC-36).
        python_version:
          type: string
          description: Versão do Python (3.10 a 3.15); só no perfil P-PY (DEC-48).
        app_target:
          type: string
          description: Alvo que o servidor de produção carrega (`modulo:atributo`); só no perfil P-PY.
        interface:
          type: string
          enum: [wsgi, asgi]
          description: Interface do alvo; só no perfil P-PY (gunicorn para wsgi, uvicorn para asgi).
        system_packages:
          type: array
          items:
            type: string
          description: Pacotes de sistema do catálogo fechado instalados na execução; só no perfil P-PY.
        output_dir:
          type: string
          description: Diretório servido; só no perfil P-STATIC (DEC-37).
        spa_fallback:
          type: boolean
          description: Rota desconhecida devolve index.html; só no perfil P-STATIC.
        build_args:
          type: array
          items:
            type: string
          description: |
            Variáveis públicas (VITE_, REACT_APP_...) entregues ao build do site
            estático. Vão para o JavaScript do navegador; nunca segredos.
        package_manager:
          type: string
          enum: [npm, bun, none, pip, uv]
          description: '`none` é site estático sem build, nada a instalar (DEC-37). `pip` e `uv` são do perfil P-PY (DEC-48).'
        install_command:
          type: string
        build_command:
          type: string
        start_command:
          type: string
        execution_mode:
          type: string
          enum: [production, development]
        port:
          type: integer
        port_origin:
          type: string
          enum: [override, declaration, platform, inference, default]
        health_path:
          type: string
        dockerfile:
          type: string
    Analysis:
      type: object
      required: [id, project_id, commit_sha, rules_version, outcome, result, created_at]
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        commit_sha:
          type: string
        rules_version:
          type: string
        outcome:
          $ref: '#/components/schemas/AnalysisOutcome'
        result:
          $ref: '#/components/schemas/AnalysisResult'
        created_at:
          type: string
          format: date-time
    AnalysisOutcome:
      type: string
      enum: [READY, NEEDS_INPUT, UNSUPPORTED]
    AnalysisResult:
      type: object
      required: [outcome, catalog_version, rules, fields, pending, conflicts, unsupported, config_variables, persistent_suggestions, service_needs, warnings, evidences, coverage]
      properties:
        outcome:
          $ref: '#/components/schemas/AnalysisOutcome'
        catalog_version:
          type: string
        rules:
          type: array
          items:
            $ref: '#/components/schemas/AppliedRule'
        fields:
          type: object
          description: Campos do plano resolvidos, por nome (`start_command`, `port`, `node_version`, ...).
          additionalProperties:
            $ref: '#/components/schemas/Field'
        pending:
          type: array
          description: O que o usuário precisa informar.
          items:
            $ref: '#/components/schemas/Finding'
        conflicts:
          type: array
          items:
            $ref: '#/components/schemas/Finding'
        unsupported:
          type: array
          items:
            $ref: '#/components/schemas/Finding'
        config_variables:
          type: array
          description: Variáveis de ambiente do projeto; nenhum valor do repositório sai daqui, exceto `default_value` de valores não secretos.
          items:
            $ref: '#/components/schemas/ConfigVariable'
        service_needs:
          type: array
          description: Serviços auxiliares (PostgreSQL) que o código parece exigir (DEC-42). Só informam.
          items:
            $ref: '#/components/schemas/ServiceNeed'
        persistent_suggestions:
          type: array
          description: Caminhos que o código parece usar para guardar dados em disco (DEC-41). Só sugerem.
          items:
            $ref: '#/components/schemas/PersistentSuggestion'
        warnings:
          type: array
          description: Avisos que nunca bloqueiam (por exemplo, credencial exposta no repositório).
          items:
            $ref: '#/components/schemas/Finding'
        evidences:
          type: array
          items:
            $ref: '#/components/schemas/Evidence'
        coverage:
          $ref: '#/components/schemas/Coverage'
    AppliedRule:
      type: object
      required: [id, version, state, status]
      properties:
        id:
          type: string
        version:
          type: string
        state:
          type: string
        status:
          type: string
        reason:
          type: string
    Origin:
      type: string
      description: |
        De onde veio o valor, em ordem decrescente de precedência. `platform` é
        um valor que a plataforma escolhe porque o repositório declara o
        contrato (o app lê `PORT`; DEC-35).
      enum: [override, declaration, platform, inference, default]
    Proposal:
      type: object
      required: [field, value, origin, rule]
      properties:
        field:
          type: string
        value:
          type: string
        origin:
          $ref: '#/components/schemas/Origin'
        rule:
          type: string
        evidence_ids:
          type: array
          items:
            type: string
    Field:
      type: object
      required: [value, origin]
      properties:
        value:
          type: string
        origin:
          $ref: '#/components/schemas/Origin'
        rules:
          type: array
          items:
            type: string
        evidence_ids:
          type: array
          items:
            type: string
        overrode:
          type: array
          description: Propostas que um override do usuário cobriu.
          items:
            $ref: '#/components/schemas/Proposal'
    Option:
      type: object
      required: [value]
      properties:
        value:
          type: string
        kind:
          type: string
          description: Inferência a partir do comando; apresente-a como tal.
          enum: [production, development]
        note:
          type: string
    Finding:
      type: object
      required: [message]
      properties:
        rule:
          type: string
        field:
          type: string
        message:
          type: string
        evidence_ids:
          type: array
          items:
            type: string
        options:
          type: array
          description: Valores que o usuário pode escolher; nunca aplicados sem escolha explícita.
          items:
            $ref: '#/components/schemas/Option'
        omitted:
          type: array
          description: O que a regra deixou de oferecer, para a interface mostrar tudo.
          items:
            type: string
    EnvReference:
      type: object
      required: [path, scope]
      properties:
        path:
          type: string
        scope:
          $ref: '#/components/schemas/Scope'
    Scope:
      type: string
      enum: [runtime, build, test, unknown]
    ConfigVariable:
      type: object
      required: [name, class, example, declared_in_example]
      properties:
        name:
          type: string
        class:
          type: string
          description: |
            `platform` (fornecida pelo Cobogó), `generable` (segredo que o app
            inventa; pode ser gerado sob ação do usuário) ou `user`.
          enum: [platform, generable, user, public]
        example:
          type: string
          description: Como aparece no arquivo de exemplo.
          enum: [absent, empty, placeholder, default, commented, exposed]
        default_value:
          type: string
          description: Só no estado `default` (valor não secreto).
        hint:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [likely_required, likely_optional, commented, prefilled, undeclared, referenced_only]
            message:
              type: string
        declared_in_example:
          type: boolean
        references:
          type: array
          items:
            $ref: '#/components/schemas/EnvReference'
        evidence_ids:
          type: array
          items:
            type: string
    Evidence:
      type: object
      required: [id, extractor, kind, source, scope]
      properties:
        id:
          type: string
        extractor:
          type: string
        kind:
          type: string
        name:
          type: string
        value:
          type: string
        source:
          type: string
        line:
          type: integer
        scope:
          $ref: '#/components/schemas/Scope'
    Coverage:
      type: object
      required: [files_read, gaps]
      properties:
        files_read:
          type: integer
        gaps:
          type: array
          items:
            type: object
            required: [path, reason]
            properties:
              path:
                type: string
              reason:
                type: string
