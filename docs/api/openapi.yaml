openapi: 3.0.3
info:
  title: API do Cobogó
  version: 0.1.0
  description: |
    Contrato da API do painel do Cobogó (DEC-27 e DEC-28). Este arquivo é
    mantido à mão; um teste (`TestOpenAPIMatchesRoutes`) falha se as rotas dele
    divergirem das registradas no código.

    **Sessão.** `POST /auth/login` (ou `/setup`, na primeira vez) devolve um
    cookie `HttpOnly`, `Secure` e `SameSite=Strict`; o navegador o envia sozinho.
    A sessão expira após 2 h sem uso e 12 h no máximo.

    **Proteção contra CSRF.** Em `POST`, `PUT` e `DELETE` o cabeçalho `Origin` (ou
    `Sec-Fetch-Site: same-origin`) tem de ser o do painel e o corpo, quando
    existe, tem de ser `application/json`. Navegadores já fazem isso; ao usar
    `curl`, envie `Origin` explicitamente. Não há CORS: o painel e a API
    compartilham a origem.

    **Erros.** Toda falha usa o mesmo formato (`Error`). O painel decide pelo
    `code`, que é estável; a `message` é para leitura humana e pode mudar.

    **Datas** estão em RFC 3339, UTC.
servers:
  - url: /api/v1
    description: Mesma origem do painel
tags:
  - name: setup
    description: Primeira execução
  - name: auth
    description: Sessão do administrador
  - name: projects
    description: Projetos
  - name: deployments
    description: Deploys, progresso, análise e plano
  - name: env
    description: Variáveis de ambiente do projeto (os valores nunca são devolvidos)
  - name: operations
    description: Ciclo de vida (excluir projeto, aplicar limites, aposentar releases), executado pelo worker
  - name: settings
    description: Política operacional editável (limites de recursos e hosts de repositório)
  - name: health
    description: Disponibilidade
security:
  - cookieAuth: []
paths:
  /healthz:
    get:
      tags: [health]
      summary: Disponibilidade da API
      description: Fora do prefixo `/api/v1`; não exige sessão.
      operationId: healthz
      security: []
      servers:
        - url: /
      responses:
        '200':
          description: A API está no ar.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok
  /setup/status:
    get:
      tags: [setup]
      summary: Diz se o administrador ainda precisa ser criado
      operationId: setupStatus
      security: []
      responses:
        '200':
          description: Estado da configuração inicial.
          content:
            application/json:
              schema:
                type: object
                required: [needs_setup]
                properties:
                  needs_setup:
                    type: boolean
  /setup:
    post:
      tags: [setup]
      summary: Cria o administrador (uma única vez)
      description: |
        Exige o token de configuração impresso uma vez no log da API. Já deixa o
        administrador autenticado. Com o administrador criado, responde
        `setup_closed`.
      operationId: setup
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, login, password]
              properties:
                token:
                  type: string
                login:
                  type: string
                  description: De 3 a 64 caracteres entre letras minúsculas, números, ponto, hífen e sublinhado.
                password:
                  type: string
                  description: De 12 a 128 caracteres.
      responses:
        '201':
          description: Administrador criado e sessão aberta (cookie definido).
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: Token inválido (`invalid_setup_token`) ou origem não permitida (`csrf`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: O administrador já foi configurado (`setup_closed`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/login:
    post:
      tags: [auth]
      summary: Entra
      description: |
        Login inexistente e senha errada têm a mesma resposta e o mesmo tempo.
        Cinco falhas por (IP, login) bloqueiam novas tentativas por 15 minutos.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login, password]
              properties:
                login:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Sessão aberta (cookie definido).
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Login ou senha incorretos (`invalid_credentials`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/logout:
    post:
      tags: [auth]
      summary: Encerra a sessão
      operationId: logout
      responses:
        '204':
          description: Sessão encerrada e cookie removido.
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /auth/me:
    get:
      tags: [auth]
      summary: Quem está autenticado
      operationId: me
      responses:
        '200':
          description: O administrador da sessão.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /auth/password:
    post:
      tags: [auth]
      summary: Troca a senha
      description: Encerra as outras sessões do administrador; a atual continua.
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password:
                  type: string
                new_password:
                  type: string
      responses:
        '204':
          description: Senha trocada.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Sessão ausente (`unauthenticated`) ou senha atual incorreta (`invalid_credentials`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
  /projects:
    get:
      tags: [projects]
      summary: Lista os projetos
      description: Do mais novo ao mais antigo, cada um com o último deploy.
      operationId: listProjects
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Before'
      responses:
        '200':
          description: Uma página de projetos.
          content:
            application/json:
              schema:
                type: object
                required: [projects, next_before]
                properties:
                  projects:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProjectSummary'
                  next_before:
                    $ref: '#/components/schemas/NextBefore'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      tags: [projects]
      summary: Cria um projeto
      description: |
        Só repositórios públicos de hosts permitidos (github.com, gitlab.com,
        codeberg.org, bitbucket.org, git.sr.ht e os extras configurados), por
        `https://`, sem credenciais, IP ou porta. `root_directory` é normalizado
        e não pode sair do repositório.
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug, repository_url]
              properties:
                slug:
                  type: string
                  pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$'
                  description: |
                    Vira o nome público (`<slug>.<apps_domain>`). Nomes reservados
                    (`www`, `mail`, `docs`, `api`, `admin`, `painel`, `cobogo`,
                    `traefik`) são recusados.'
                repository_url:
                  type: string
                  format: uri
                root_directory:
                  type: string
                  description: Subdiretório do repositório; vazio é a raiz.
      responses:
        '201':
          description: Projeto criado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          description: O slug já existe (`conflict`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /projects/{id}:
    get:
      tags: [projects]
      summary: Um projeto
      operationId: getProject
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: O projeto.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [projects, operations]
      summary: Exclui o projeto
      description: |
        Exclusão lógica (DEC-38). Na hora: o projeto some das listas e responde
        404, a rota sai do ar (o Traefik a perde em até 2 s), as variáveis
        cifradas são apagadas e deploys na fila ou aguardando resposta são
        cancelados. Depois, o worker remove contêineres, rede e imagens do
        projeto; acompanhe pela operação devolvida. **O histórico fica**
        (deploys, eventos, análises, releases e auditoria). Os **volumes de
        dados** só saem se `delete_data` for `true` (DEC-41); sem isso ficam e
        aparecem em `GET /volumes/orphans`. Recusado com `deployment_in_progress` se há deploy em execução.
        O nome do projeto fica livre para reuso.
      operationId: deleteProject
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm_slug]
              properties:
                confirm_slug:
                  type: string
                  description: O nome (slug) do projeto, digitado para confirmar.
                delete_data:
                  type: boolean
                  default: false
                  description: Apaga também os volumes de dados do projeto. **Irreversível.**
      responses:
        '202':
          description: A exclusão foi aceita; a limpeza segue pelo worker.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        '400':
          description: Corpo inválido ou nome de confirmação diferente (`confirmation_mismatch`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Há um deploy em execução (`deployment_in_progress`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /projects/{id}/operations:
    get:
      tags: [operations]
      summary: Operações recentes do projeto
      description: |
        Da mais nova à mais antiga, inclusive de um projeto excluído (a limpeza
        dele pode estar em andamento ou ter falhado).
      operationId: listOperations
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: As operações.
          content:
            application/json:
              schema:
                type: object
                required: [operations]
                properties:
                  operations:
                    type: array
                    items:
                      $ref: '#/components/schemas/Operation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /operations/{id}:
    get:
      tags: [operations]
      summary: Uma operação de ciclo de vida
      operationId: getOperation
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: A operação.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{id}/limits/apply:
    post:
      tags: [projects, operations]
      summary: Aplica os limites atuais à release no ar
      description: |
        Pede ao worker que atualize o contêiner da release ativa com os limites
        efetivos de hoje, sem reiniciá-lo (#33). Memória e swap sobem e descem
        juntos. **Reduzir a memória abaixo do uso atual é recusado** (a
        operação termina `FAILED` com a explicação), em vez de matar a
        aplicação. O resultado traz os limites de antes e de depois.
      operationId: applyProjectLimits
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '202':
          description: A operação foi enfileirada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: O projeto não tem release no ar (`no_active_release`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /projects/{id}/app/stop:
    post:
      tags: [projects, operations]
      summary: Para a aplicação do projeto
      description: |
        Pede ao worker que pare o contêiner da release ativa **e o mantenha**
        (DEC-40): imagem e configuração continuam, e iniciar de novo é rápido.
        O endereço público passa a mostrar a página de projeto inativo (503).
        `app_state` do projeto vira `stopped`, que não é o mesmo que falhou.
      operationId: stopProjectApp
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '202':
          description: A operação foi enfileirada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: O projeto não tem release no ar (`no_active_release`) ou a aplicação já está parada (`app_already_stopped`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /projects/{id}/app/start:
    post:
      tags: [projects, operations]
      summary: Inicia a aplicação parada do projeto
      description: |
        Pede ao worker que inicie o contêiner mantido e espere a prontidão
        como um deploy faria. Só então a rota volta ao contêiner. Se não ficar
        pronta no prazo, a operação termina `FAILED` com o motivo e o projeto
        continua parado.
      operationId: startProjectApp
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '202':
          description: A operação foi enfileirada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: O projeto não tem release no ar (`no_active_release`) ou a aplicação já está no ar (`app_already_running`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /projects/{id}/app/restart:
    post:
      tags: [projects, operations]
      summary: Reinicia a aplicação do projeto
      description: |
        Parar e iniciar. **Não relê variáveis nem limites**: o contêiner é o
        mesmo. Um novo deploy relê as variáveis; `POST .../limits/apply` muda
        os limites. Vale também com a aplicação parada (equivale a iniciar).
      operationId: restartProjectApp
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '202':
          description: A operação foi enfileirada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: O projeto não tem release no ar (`no_active_release`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /projects/{id}/persistent-paths:
    get:
      tags: [projects]
      summary: Caminhos persistentes e volumes do projeto
      description: |
        Os caminhos que o **usuário** declarou para guardar dados em volume
        nomeado (DEC-41) e os volumes que o worker criou para eles, com o
        tamanho (medido de tempos em tempos; `null` até a primeira medição).
      operationId: getPersistentPaths
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Caminhos e volumes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersistentView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [projects]
      summary: Define os caminhos persistentes do projeto
      description: |
        Substitui a lista inteira (`[]` não persiste nada). Caminhos absolutos,
        sem `..`, fora do sistema do contêiner (`/etc`, `/usr`, `/proc`...),
        sem um dentro do outro e no máximo 8. Vale a partir do próximo deploy.
        Um caminho tirado da lista deixa o volume dele como **volume sem
        projeto** (`GET /volumes/orphans`), sem apagar dados. Só o usuário
        declara: nada é inferido nem vem do repositório.
      operationId: putPersistentPaths
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paths]
              properties:
                paths:
                  type: array
                  maxItems: 8
                  items:
                    type: string
      responses:
        '200':
          description: Caminhos e volumes, já com a nova lista.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersistentView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
  /volumes/orphans:
    get:
      tags: [operations]
      summary: Volumes sem projeto
      description: |
        Volumes de projetos excluídos e de caminhos que deixaram de ser
        persistentes. Ocupam disco até serem apagados.
      operationId: listOrphanVolumes
      responses:
        '200':
          description: Os volumes.
          content:
            application/json:
              schema:
                type: object
                required: [volumes]
                properties:
                  volumes:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProjectVolume'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /volumes/{name}:
    delete:
      tags: [operations]
      summary: Apaga um volume sem projeto
      description: |
        **Irreversível.** Só um volume sem projeto pode ser apagado; a
        confirmação é o nome do volume. O worker executa (`delete_volume`).
      operationId: deleteVolume
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm_name]
              properties:
                confirm_name:
                  type: string
      responses:
        '202':
          description: A operação foi enfileirada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: O volume ainda é usado por um caminho persistente (`volume_in_use`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /projects/{id}/database:
    get:
      tags: [projects]
      summary: O banco de dados do projeto
      description: |
        O que a última análise achou sobre PostgreSQL (`need`, com `level`
        `required` ou `possible` e as evidências), a escolha vigente do projeto
        (`service`) e os dados do banco gerenciado, com o tamanho. DEC-42.
      operationId: getDatabase
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: O estado do banco.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [projects]
      summary: Escolhe o destino do banco
      description: |
        Responde à pendência `database` (HEU-06.6). `managed`: o Cobogó cria um
        PostgreSQL só deste projeto no próximo deploy e liga a variável de
        conexão a ele (a senha é gerada aqui e nunca devolvida). `external`: a
        URL de um banco que a pessoa já tem entra pelo fluxo de variáveis.
        `none`: o projeto não precisa de banco. Os deploys parados esperando
        esta escolha voltam à fila (`requeued`). **Nada é criado aqui.** Recusado
        com `variable_defined` se a variável já tem um valor digitado (o vínculo
        nunca o sobrescreve) e com `managed_exists` se já há um banco gerenciado.
      operationId: chooseDatabase
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [choice]
              properties:
                choice:
                  type: string
                  enum: [managed, external, none]
                variable:
                  type: string
                  description: A variável de conexão. Padrão `DATABASE_URL`.
      responses:
        '200':
          description: A escolha foi registrada.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/DatabaseView'
                  - type: object
                    required: [requeued]
                    properties:
                      requeued:
                        type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: A variável já tem valor digitado (`variable_defined`) ou já há um PostgreSQL gerenciado (`managed_exists`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [projects, operations]
      summary: Apaga o PostgreSQL gerenciado e os dados
      description: |
        **Irreversível.** Pede ao worker que remova o contêiner do banco e o
        volume dos dados (`delete_service`) e tira a variável de conexão
        vinculada. A confirmação é o nome do projeto.
      operationId: deleteDatabase
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm_slug]
              properties:
                confirm_slug:
                  type: string
      responses:
        '202':
          description: A operação foi enfileirada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: O projeto não tem um PostgreSQL gerenciado (`no_managed_database`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /projects/{id}/deployments:
    get:
      tags: [deployments]
      summary: Histórico de deploys do projeto
      description: Do mais novo ao mais antigo.
      operationId: listDeployments
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Before'
      responses:
        '200':
          description: Uma página de deploys.
          content:
            application/json:
              schema:
                type: object
                required: [deployments, next_before]
                properties:
                  deployments:
                    type: array
                    items:
                      $ref: '#/components/schemas/Deployment'
                  next_before:
                    $ref: '#/components/schemas/NextBefore'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [deployments]
      summary: Cria um deploy
      description: |
        Responde sem esperar o build. `idempotency_key` é única por projeto; a
        mesma chave de novo responde `conflict`. `overrides` costuma vir só ao
        responder uma pendência, mas pode ser antecipado.
      operationId: createDeployment
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idempotency_key]
              properties:
                idempotency_key:
                  type: string
                  maxLength: 128
                overrides:
                  $ref: '#/components/schemas/Overrides'
      responses:
        '202':
          description: Deploy criado e na fila.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deployment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: A `idempotency_key` já existe neste projeto (`conflict`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /deployments/{id}:
    get:
      tags: [deployments]
      summary: Resumo de um deploy
      description: |
        Não traz os eventos; use `/deployments/{id}/events`. `release` só existe
        depois do sucesso.
      operationId: getDeployment
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: O deploy.
          content:
            application/json:
              schema:
                type: object
                required: [deployment, last_event_sequence]
                properties:
                  deployment:
                    $ref: '#/components/schemas/Deployment'
                  release:
                    $ref: '#/components/schemas/Release'
                  last_event_sequence:
                    type: integer
                    minimum: 0
                    description: Sequência do último evento; 0 se ainda não há eventos.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
  /deployments/{id}/events:
    get:
      tags: [deployments]
      summary: Eventos novos de um deploy
      description: |
        Para acompanhar o progresso, consulte a cada 2 a 3 segundos com
        `after = next_after` da resposta anterior (começando em 0). Pare quando
        receber `settled = true` e `has_more = false`: o estado final do deploy
        é gravado antes do último evento, então o estado sozinho não basta.
        Um deploy em `NEEDS_INPUT` fica `settled` até ser respondido.
      operationId: listEvents
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: after
          in: query
          description: Devolve só eventos com `sequence` maior que este valor.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 200
      responses:
        '200':
          description: Eventos em ordem de sequência.
          content:
            application/json:
              schema:
                type: object
                required: [events, next_after, has_more, state, settled]
                properties:
                  events:
                    type: array
                    items:
                      $ref: '#/components/schemas/DeploymentEvent'
                  next_after:
                    type: integer
                    description: Use como `after` na próxima consulta.
                  has_more:
                    type: boolean
                    description: Há mais eventos já gravados além desta página.
                  state:
                    $ref: '#/components/schemas/DeploymentState'
                  settled:
                    type: boolean
                    description: |
                      O job está encerrado: nenhum evento novo aparece sem uma
                      ação do usuário. Com `has_more = false`, esta página já
                      contém tudo.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
  /deployments/{id}/analysis:
    get:
      tags: [deployments]
      summary: Análise do deploy
      description: O snapshot da análise do commit (campos resolvidos, pendências, variáveis, avisos, evidências).
      operationId: getAnalysis
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: A análise.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Analysis'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: Deploy inexistente (`not_found`) ou ainda sem análise (`analysis_unavailable`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /deployments/{id}/plan:
    get:
      tags: [deployments]
      summary: Plano e Dockerfile do deploy
      description: |
        Derivado da análise pelo planner atual. Só existe quando a análise está
        `READY`.
      operationId: getPlan
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: O plano.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: Deploy inexistente (`not_found`) ou ainda sem análise (`analysis_unavailable`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: A análise não está pronta (`plan_unavailable`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /deployments/{id}/answers:
    post:
      tags: [deployments]
      summary: Responde as pendências de um deploy
      description: |
        Só vale em `NEEDS_INPUT`. O deploy volta à fila e a nova análise roda
        sobre o mesmo commit.
      operationId: answerDeployment
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [overrides]
              properties:
                overrides:
                  $ref: '#/components/schemas/Overrides'
      responses:
        '202':
          description: Resposta registrada; o deploy está na fila de novo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deployment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: O deploy não está aguardando informações (`not_awaiting_input`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /deployments/{id}/cancel:
    post:
      tags: [deployments]
      summary: Cancela um deploy que ainda não executou
      description: |
        Só em `QUEUED` (sem worker) e `NEEDS_INPUT`. Não há corpo.
      operationId: cancelDeployment
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Deploy em `CANCELLED`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deployment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: O worker já começou (`deployment_started`) ou o deploy já terminou (`deployment_finished`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /projects/{id}/env:
    get:
      tags: [env]
      summary: Lista as variáveis do projeto
      description: Só nome e metadados; o valor nunca é devolvido.
      operationId: listEnv
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: As variáveis.
          content:
            application/json:
              schema:
                type: object
                required: [variables]
                properties:
                  variables:
                    type: array
                    items:
                      $ref: '#/components/schemas/EnvVariable'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{id}/env/import:
    post:
      tags: [env]
      summary: Importa variáveis de um .env colado, com revisão
      description: |
        Duas etapas, as duas com o mesmo texto. `preview` lê o texto **sem
        executar nem expandir nada** e diz, por nome, o que aconteceria
        (`create`, `replace` ou `blocked`), a classe e os avisos; **nunca
        devolve valores** nem grava nada. `apply` grava só os `names`
        escolhidos que a prévia não bloqueou, cada um como uma variável nova ou
        uma versão nova (origem `imported`). Até 200 variáveis e 256 KiB.
        Variáveis da plataforma (como `PORT`) e vazias ficam bloqueadas.
      operationId: importEnv
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text, mode]
              properties:
                text:
                  type: string
                  maxLength: 262144
                mode:
                  type: string
                  enum: [preview, apply]
                names:
                  type: array
                  description: 'Obrigatório em `apply`: as variáveis escolhidas.'
                  items:
                    type: string
      responses:
        '200':
          description: A prévia (`mode=preview`) ou o resultado (`mode=apply`).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ImportPreview'
                  - $ref: '#/components/schemas/ImportResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          description: O texto excede 256 KiB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /projects/{id}/env/suggestions:
    get:
      tags: [env]
      summary: Valores que o Cobogó conhece e oferece
      description: |
        Lista **fechada**: `<SLUG>_URL`, `APP_URL`, `SITE_URL`, `BASE_URL`,
        `PUBLIC_URL` e `NEXT_PUBLIC_SITE_URL`, só para um nome que a última
        análise encontrou e o projeto ainda não definiu, e só com domínio das
        aplicações configurado. O valor é o endereço público do projeto, sem a
        barra final. Nada é aplicado sozinho: a pessoa confirma e grava com
        `PUT /projects/{id}/env/{name}`.
      operationId: envSuggestions
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: As sugestões.
          content:
            application/json:
              schema:
                type: object
                required: [suggestions, domain_configured]
                properties:
                  domain_configured:
                    type: boolean
                  suggestions:
                    type: array
                    items:
                      type: object
                      required: [name, value, reason]
                      properties:
                        name:
                          type: string
                        value:
                          type: string
                        reason:
                          type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{id}/required-env:
    get:
      tags: [env]
      summary: Variáveis que o usuário exigiu e as prováveis
      description: |
        `names` são as exigidas (sem valor, o deploy falha cedo, antes do
        build); `likely` são as que a última análise indica como provavelmente
        obrigatórias, para a pessoa marcar.
      operationId: getRequiredEnv
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: As listas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequiredEnv'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [env]
      summary: Define as variáveis obrigatórias
      description: |
        Substitui a lista inteira (`[]` não exige nenhuma). Variáveis da
        plataforma não podem ser exigidas. Até 200 nomes.
      operationId: putRequiredEnv
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [names]
              properties:
                names:
                  type: array
                  maxItems: 200
                  items:
                    type: string
      responses:
        '200':
          description: As listas, já com a nova.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequiredEnv'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{id}/env-history:
    get:
      tags: [env]
      summary: O que mudou nas variáveis do projeto
      description: |
        Lido da auditoria, do mais novo para o mais antigo (até 100): nome,
        ação, versão, origem, quem e quando. **Sem valores**, nem os antigos:
        valor errado se corrige digitando de novo.
      operationId: envHistory
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: As mudanças.
          content:
            application/json:
              schema:
                type: object
                required: [changes]
                properties:
                  changes:
                    type: array
                    items:
                      $ref: '#/components/schemas/EnvChange'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{id}/env/{name}:
    put:
      tags: [env]
      summary: Define (ou substitui) uma variável
      description: |
        O valor é cifrado e nunca volta pela API. Variáveis da plataforma
        (como `PORT`) não podem ser definidas. Um deploy em execução continua
        com o valor antigo até um novo deploy (`redeploy_required`).
      operationId: putEnv
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/EnvName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value:
                  type: string
                  minLength: 1
                  maxLength: 32768
      responses:
        '200':
          description: Variável gravada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvVariableResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [env]
      summary: Remove uma variável
      operationId: deleteEnv
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/EnvName'
      responses:
        '204':
          description: Variável removida.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{id}/env/{name}/generate:
    post:
      tags: [env]
      summary: Gera um segredo que o próprio app inventa
      description: |
        Só para nomes como `JWT_SECRET` ou `SESSION_SECRET`, e só por ação
        explícita. Se já houver valor, é preciso enviar `{"replace": true}`,
        porque trocá-lo invalida o que foi assinado com o anterior. O valor
        gerado nunca é devolvido.
      operationId: generateEnv
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/EnvName'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                replace:
                  type: boolean
                  default: false
      responses:
        '200':
          description: Segredo gerado e guardado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvVariableResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: A variável já tem valor e `replace` não foi enviado (`conflict`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /projects/{id}/limits:
    get:
      tags: [projects]
      summary: Limites de recursos do projeto
      description: |
        `overrides` são só os valores que o projeto define; `effective` traz o
        valor que vale para cada limite e de onde ele vem (`project`,
        `database`, `env` ou `default`). A mudança vale a partir do próximo
        deploy; um contêiner em execução mantém os limites com que subiu.
      operationId: getProjectLimits
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Sobreposições e valores efetivos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LimitsView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [projects]
      summary: Substitui os limites do projeto
      description: |
        Troca todas as sobreposições: campo ausente volta a herdar do nível de
        cima, e `{}` limpa tudo. Os valores seguem as mesmas faixas das
        configurações globais.
      operationId: putProjectLimits
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Limits'
      responses:
        '200':
          description: Sobreposições e valores efetivos depois da troca.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LimitsView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
  /settings:
    get:
      tags: [settings]
      summary: Política operacional editável
      description: |
        Cada chave com o valor efetivo, a origem, o padrão de fábrica e a faixa
        aceita, para montar o formulário. Fundação e segurança (banco, chave,
        origem pública, proxies) não aparecem: só o ambiente as define.
      operationId: listSettings
      responses:
        '200':
          description: As chaves.
          content:
            application/json:
              schema:
                type: object
                required: [settings]
                properties:
                  settings:
                    type: array
                    items:
                      $ref: '#/components/schemas/Setting'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /settings/{key}:
    put:
      tags: [settings]
      summary: Define uma configuração
      description: |
        Números para os limites; lista de nomes de host para `extra_git_hosts`.
        Texto no lugar de número é recusado. Limites valem a partir do próximo
        deploy; hosts valem na hora.
      operationId: putSetting
      parameters:
        - $ref: '#/components/parameters/SettingKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value:
                  description: Número ou lista de textos, conforme o `kind` da chave.
      responses:
        '200':
          description: A chave com o novo valor efetivo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Setting'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: Chave desconhecida (`not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [settings]
      summary: Devolve uma configuração ao ambiente ou ao padrão
      description: Idempotente.
      operationId: resetSetting
      parameters:
        - $ref: '#/components/parameters/SettingKey'
      responses:
        '200':
          description: A chave com o valor efetivo depois de remover o do banco.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Setting'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: Chave desconhecida (`not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-cobogo_session
      description: |
        Cookie de sessão definido por `/auth/login` ou `/setup`. Em
        desenvolvimento por HTTP (`COBOGO_COOKIE_INSECURE=1`) o nome é
        `cobogo_session`.
  headers:
    SessionCookie:
      description: Cookie de sessão (`HttpOnly`, `Secure`, `SameSite=Strict`, `Path=/`).
      schema:
        type: string
  parameters:
    SettingKey:
      name: key
      in: path
      required: true
      schema:
        type: string
        enum: [app_memory_mb, app_cpus, app_pids, build_memory_mb, build_cpus, extra_git_hosts, apps_domain, apps_scheme]
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EnvName:
      name: name
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z_][A-Za-z0-9_]{0,127}$'
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Before:
      name: before
      in: query
      description: Cursor opaco; use o `next_before` da página anterior.
      schema:
        type: string
  responses:
    BadRequest:
      description: Requisição inválida (`invalid_request`, `weak_password`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthenticated:
      description: Sessão ausente ou expirada (`unauthenticated`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: |
        Não existe ou pertence a outro administrador (`not_found`); a API não
        distingue.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: Muitas tentativas (`rate_limited`); veja `Retry-After`, em segundos.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Estável; decida por ele.
              enum:
                - invalid_request
                - unauthenticated
                - forbidden
                - csrf
                - not_found
                - conflict
                - unsupported_media_type
                - payload_too_large
                - rate_limited
                - unavailable
                - internal
                - invalid_credentials
                - invalid_setup_token
                - setup_closed
                - weak_password
                - not_awaiting_input
                - deployment_started
                - deployment_finished
                - analysis_unavailable
                - plan_unavailable
                - deployment_in_progress
                - confirmation_mismatch
                - no_active_release
            message:
              type: string
              description: Em português, para leitura humana.
    NextBefore:
      type: string
      description: Cursor da próxima página; vazio na última.
    Operation:
      type: object
      required: [id, kind, state, params, result, attempts, not_before, created_at, updated_at]
      description: |
        Um pedido de ciclo de vida que o worker executa (DEC-38). `PENDING`
        espera (ou espera até `not_before`), `RUNNING` está em execução, `DONE`
        terminou e `FAILED` esgotou as tentativas ou foi recusado (veja `error`).
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [retire_releases, delete_project, apply_limits, sweep, stop_app, start_app, restart_app, delete_volume, delete_service]
        state:
          type: string
          enum: [PENDING, RUNNING, DONE, FAILED]
        params:
          type: object
          additionalProperties: true
        result:
          type: object
          additionalProperties: true
          description: |
            O que a operação fez: contêineres e imagens removidos, ou os limites
            de antes e de depois.
        error:
          type: string
          description: Em português, para leitura humana.
        attempts:
          type: integer
        not_before:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    User:
      type: object
      required: [id, login, created_at]
      properties:
        id:
          type: string
          format: uuid
        login:
          type: string
        created_at:
          type: string
          format: date-time
    UserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/User'
    Limits:
      type: object
      description: |
        Tetos de recursos. Todos os campos são opcionais; ausente (ou zero)
        significa "herda do nível de cima".
      additionalProperties: false
      properties:
        app_memory_mb:
          type: integer
          minimum: 64
          maximum: 262144
          description: Memória de cada contêiner de aplicação, em MiB (sem swap). Passar dela mata a aplicação.
        app_cpus:
          type: number
          minimum: 0.1
          maximum: 256
        app_pids:
          type: integer
          minimum: 16
          maximum: 65536
        build_memory_mb:
          type: integer
          minimum: 256
          maximum: 262144
        build_cpus:
          type: number
          minimum: 0.1
          maximum: 256
    LimitsView:
      type: object
      required: [overrides, effective]
      properties:
        overrides:
          $ref: '#/components/schemas/Limits'
        effective:
          type: object
          description: Por limite (`app_memory_mb`, `app_cpus`, ...), o valor que vale e de onde vem.
          additionalProperties:
            type: object
            required: [value, source]
            properties:
              value:
                type: number
              source:
                type: string
                enum: [project, database, env, default]
    Setting:
      type: object
      required: [key, kind, value, source, default]
      properties:
        key:
          type: string
        kind:
          type: string
          enum: [integer, number, hosts, domain, choice]
        value:
          description: |
            Número (`integer`, `number`), lista de textos (`hosts`) ou texto
            (`domain`, `choice`). `apps_domain` vazio desliga o roteamento das
            aplicações; pode levar porta (`localhost:8088`).
        choices:
          type: array
          items:
            type: string
          description: Valores aceitos de uma chave `choice`.
        source:
          type: string
          enum: [database, env, default]
        default:
          description: Padrão de fábrica, do mesmo tipo de `value`.
        min:
          type: number
          description: Nos limites e nas políticas numéricas (espera e imagens retidas).
        max:
          type: number
    Project:
      type: object
      required: [id, slug, repository_url, root_directory, limits, created_at, app_state, persistent_paths]
      properties:
        persistent_paths:
          type: array
          items:
            type: string
          description: Caminhos do contêiner guardados em volume nomeado (DEC-41).
        app_state:
          type: string
          enum: [none, running, stopped]
          description: |
            Estado da release ativa: `none` (nenhuma), `running` ou `stopped`
            (parada de propósito, DEC-40; não é uma falha).
        limits:
          $ref: '#/components/schemas/Limits'
        id:
          type: string
          format: uuid
        slug:
          type: string
        repository_url:
          type: string
        root_directory:
          type: string
        created_at:
          type: string
          format: date-time
    ProjectSummary:
      allOf:
        - $ref: '#/components/schemas/Project'
        - type: object
          required: [last_deployment]
          properties:
            last_deployment:
              nullable: true
              allOf:
                - $ref: '#/components/schemas/DeploymentBrief'
    DeploymentBrief:
      type: object
      required: [id, state, created_at]
      properties:
        id:
          type: string
          format: uuid
        state:
          $ref: '#/components/schemas/DeploymentState'
        created_at:
          type: string
          format: date-time
    DeploymentState:
      type: string
      description: |
        Final: `SUCCEEDED`, `FAILED`, `UNSUPPORTED`, `CANCELLED`. Espera por
        você: `NEEDS_INPUT`.
      enum:
        - QUEUED
        - FETCHING
        - ANALYZING
        - NEEDS_INPUT
        - UNSUPPORTED
        - GENERATING
        - BUILDING
        - PROVISIONING
        - STARTING
        - VERIFYING
        - SUCCEEDED
        - FAILED
        - CANCELLED
    Overrides:
      type: object
      description: |
        Valores explícitos por campo do plano. Campos aceitos: `start_command`,
        `build_command`, `port`, `execution_mode` (`production` ou
        `development`), `node_version` (`22`, `24` ou `26`), `health_path`,
        `package_manager` (`npm` ou `bun`, quando o repositório tem os dois
        lockfiles), `bun_version` (`1`, `1.Y` ou `1.Y.Z`; DEC-36), `profile`
        (`P-NODE`, `P-BUN` ou `P-STATIC`), `output_dir` e `spa_fallback`
        (`true` ou `false`; DEC-37).
        Valores de variáveis de ambiente nunca passam por aqui.
      additionalProperties:
        type: string
    Deployment:
      type: object
      required: [id, project_id, commit_sha, state, idempotency_key, overrides, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        analysis_id:
          type: string
          format: uuid
          description: Ausente até a primeira análise.
        commit_sha:
          type: string
          description: Vazio até o commit ser fixado.
        state:
          $ref: '#/components/schemas/DeploymentState'
        idempotency_key:
          type: string
        overrides:
          $ref: '#/components/schemas/Overrides'
        failure_reason:
          type: string
          description: Só em `FAILED`.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    DeploymentEvent:
      type: object
      required: [id, deployment_id, sequence, stage, event_type, occurred_at, payload]
      properties:
        id:
          type: string
          format: uuid
        deployment_id:
          type: string
          format: uuid
        sequence:
          type: integer
          description: Crescente e sem repetição dentro do deploy.
        stage:
          type: string
          description: Por exemplo `fetching`, `building`, `verifying`, `pipeline`.
        event_type:
          type: string
          description: Por exemplo `started`, `completed`, `log`, `probe`, `attempt`, `failed`, `succeeded`, `cancelled`.
        occurred_at:
          type: string
          format: date-time
        payload:
          type: object
          additionalProperties: true
          description: |
            Varia por evento. Nunca contém valores de variáveis (só nomes). Em
            `failed`, pode trazer `error`, `exit_code`, `log_tail` (já
            redigido) e `diagnosis` (`confidence`, `message`, `variables` e,
            quando a correção é um override num novo deploy, `field`).
    Release:
      type: object
      required: [id, deployment_id, image_id, container_id, operational_state, health, host_port, created_at]
      properties:
        id:
          type: string
          format: uuid
        deployment_id:
          type: string
          format: uuid
        image_id:
          type: string
        container_id:
          type: string
        operational_state:
          type: string
        health:
          type: string
        host_port:
          type: integer
          description: Porta no loopback do host, para acesso direto ao contêiner.
        url:
          type: string
          description: |
            Endereço público com que a release foi roteada (`<slug>.<apps_domain>`).
            Ausente quando não havia domínio configurado. Mudar o domínio depois
            não reescreve releases antigas.
        created_at:
          type: string
          format: date-time
    EnvVariable:
      type: object
      required: [name, version, source, key_version, created_at, updated_at]
      properties:
        name:
          type: string
        version:
          type: integer
        source:
          type: string
          enum: [user, generated, imported, linked]
        key_version:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ImportWarning:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [platform, empty, too_large, null_char, duplicate, placeholder, credential, not_expanded, replaces_existing]
        message:
          type: string
          description: Nunca contém o valor; para `credential`, só o tipo.
    ImportPreview:
      type: object
      required: [variables, diagnostics]
      properties:
        variables:
          type: array
          items:
            type: object
            required: [name, line, action, class, default_selected, warnings]
            properties:
              name:
                type: string
              line:
                type: integer
                description: Linha da atribuição que vale.
              action:
                type: string
                enum: [create, replace, blocked]
              class:
                type: string
                enum: [platform, generable, user, public]
              default_selected:
                type: boolean
                description: |
                  Se a interface deve marcar a variável por padrão. Fica
                  `false` para as que substituiriam um valor, as que parecem
                  placeholder e as bloqueadas.
              warnings:
                type: array
                items:
                  $ref: '#/components/schemas/ImportWarning'
        diagnostics:
          type: array
          description: Linhas que não viraram variável. Nunca repetem o conteúdo da linha.
          items:
            type: object
            required: [line, code, message]
            properties:
              line:
                type: integer
              name:
                type: string
              code:
                type: string
                enum: [not_assignment, invalid_name, multiline_value, unsupported_syntax, empty_name]
              message:
                type: string
    ImportResult:
      type: object
      required: [applied, skipped]
      properties:
        applied:
          type: array
          items:
            type: object
            required: [name, version, redeploy_required]
            properties:
              name:
                type: string
              version:
                type: integer
              redeploy_required:
                type: boolean
        skipped:
          type: array
          items:
            type: object
            required: [name, reason]
            properties:
              name:
                type: string
              reason:
                type: string
                enum: [not_in_text, blocked]
    RequiredEnv:
      type: object
      required: [names, likely]
      properties:
        names:
          type: array
          items:
            type: string
        likely:
          type: array
          items:
            type: string
    EnvChange:
      type: object
      required: [action, at]
      properties:
        name:
          type: string
          description: Ausente nas ações do projeto todo (`env.import`, `env.required`).
        action:
          type: string
          enum: [env.set, env.generate, env.delete, env.import, env.required]
        version:
          type: integer
        source:
          type: string
          enum: [user, generated, imported, linked]
        actor:
          type: string
        at:
          type: string
          format: date-time
        names:
          type: array
          items:
            type: string
    EnvVariableResult:
      allOf:
        - $ref: '#/components/schemas/EnvVariable'
        - type: object
          required: [redeploy_required]
          properties:
            redeploy_required:
              type: boolean
              description: Um deploy em execução continua com o valor antigo até um novo deploy.
    ProjectVolume:
      type: object
      required: [name, project_id, project_slug, path, size_bytes, measured_at, created_at, orphan, project_deleted]
      properties:
        name:
          type: string
        project_id:
          type: string
          format: uuid
        project_slug:
          type: string
        path:
          type: string
        size_bytes:
          type: integer
          format: int64
          nullable: true
        measured_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        orphan:
          type: boolean
          description: Sem projeto vivo, ou o caminho deixou de ser persistente.
        project_deleted:
          type: boolean
    ServiceNeed:
      type: object
      required: [engine, level, variable, reason, evidence]
      properties:
        engine:
          type: string
          enum: [postgres]
        level:
          type: string
          enum: [required, possible]
          description: |
            `required`: código de runtime usa a engine (a pergunta bloqueia o
            deploy antes do build). `possible`: só a dependência (vira sugestão).
        variable:
          type: string
        reason:
          type: string
        evidence:
          type: array
          items:
            type: string
    Service:
      type: object
      required: [id, project_id, engine, mode, variable, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        engine:
          type: string
          enum: [postgres]
        mode:
          type: string
          enum: [managed, external, none]
        variable:
          type: string
        container_name:
          type: string
        volume_name:
          type: string
        status:
          type: string
          enum: [pending, ready, failed, deleting]
        status_detail:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    DatabaseView:
      type: object
      required: [need, service, variable, volume]
      properties:
        need:
          allOf:
            - $ref: '#/components/schemas/ServiceNeed'
          nullable: true
        service:
          allOf:
            - $ref: '#/components/schemas/Service'
          nullable: true
        variable:
          type: string
        volume:
          allOf:
            - $ref: '#/components/schemas/ProjectVolume'
          nullable: true
    PersistentSuggestion:
      type: object
      required: [path, kind, confidence, reason, evidence]
      properties:
        path:
          type: string
          description: |
            Caminho no contêiner. Vazio quando o código usa disco mas não se
            achou onde: a pessoa informa.
        kind:
          type: string
          enum: [sqlite, write_dir]
        confidence:
          type: string
          enum: [strong, weak]
        reason:
          type: string
        evidence:
          type: array
          items:
            type: string
          description: Arquivos e linhas em que a sugestão se apoia.
    PersistentView:
      type: object
      required: [paths, volumes, suggestions]
      properties:
        suggestions:
          type: array
          description: |
            Pistas da última análise para caminhos ainda não declarados. Só
            sugerem; quem declara é o usuário (`PUT .../persistent-paths`).
          items:
            $ref: '#/components/schemas/PersistentSuggestion'

        paths:
          type: array
          items:
            type: string
        volumes:
          type: array
          items:
            $ref: '#/components/schemas/ProjectVolume'
    Plan:
      type: object
      required: [profile, runtime, build_image, package_manager, install_command, start_command, execution_mode, port, port_origin, health_path, dockerfile]
      properties:
        profile:
          type: string
          enum: [P-NODE, P-BUN, P-STATIC]
        runtime:
          type: string
        build_image:
          type: string
        node_version:
          type: string
          description: Só no perfil P-NODE.
        bun_version:
          type: string
          description: Tag da imagem oven/bun; só no perfil P-BUN (DEC-36).
        output_dir:
          type: string
          description: Diretório servido; só no perfil P-STATIC (DEC-37).
        spa_fallback:
          type: boolean
          description: Rota desconhecida devolve index.html; só no perfil P-STATIC.
        build_args:
          type: array
          items:
            type: string
          description: |
            Variáveis públicas (VITE_, REACT_APP_...) entregues ao build do site
            estático. Vão para o JavaScript do navegador; nunca segredos.
        package_manager:
          type: string
          enum: [npm, bun, none]
          description: '`none` é site estático sem build, nada a instalar (DEC-37).'
        install_command:
          type: string
        build_command:
          type: string
        start_command:
          type: string
        execution_mode:
          type: string
          enum: [production, development]
        port:
          type: integer
        port_origin:
          type: string
          enum: [override, declaration, platform, inference, default]
        health_path:
          type: string
        dockerfile:
          type: string
    Analysis:
      type: object
      required: [id, project_id, commit_sha, rules_version, outcome, result, created_at]
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        commit_sha:
          type: string
        rules_version:
          type: string
        outcome:
          $ref: '#/components/schemas/AnalysisOutcome'
        result:
          $ref: '#/components/schemas/AnalysisResult'
        created_at:
          type: string
          format: date-time
    AnalysisOutcome:
      type: string
      enum: [READY, NEEDS_INPUT, UNSUPPORTED]
    AnalysisResult:
      type: object
      required: [outcome, catalog_version, rules, fields, pending, conflicts, unsupported, config_variables, persistent_suggestions, service_needs, warnings, evidences, coverage]
      properties:
        outcome:
          $ref: '#/components/schemas/AnalysisOutcome'
        catalog_version:
          type: string
        rules:
          type: array
          items:
            $ref: '#/components/schemas/AppliedRule'
        fields:
          type: object
          description: Campos do plano resolvidos, por nome (`start_command`, `port`, `node_version`, ...).
          additionalProperties:
            $ref: '#/components/schemas/Field'
        pending:
          type: array
          description: O que o usuário precisa informar.
          items:
            $ref: '#/components/schemas/Finding'
        conflicts:
          type: array
          items:
            $ref: '#/components/schemas/Finding'
        unsupported:
          type: array
          items:
            $ref: '#/components/schemas/Finding'
        config_variables:
          type: array
          description: Variáveis de ambiente do projeto; nenhum valor do repositório sai daqui, exceto `default_value` de valores não secretos.
          items:
            $ref: '#/components/schemas/ConfigVariable'
        service_needs:
          type: array
          description: Serviços auxiliares (PostgreSQL) que o código parece exigir (DEC-42). Só informam.
          items:
            $ref: '#/components/schemas/ServiceNeed'
        persistent_suggestions:
          type: array
          description: Caminhos que o código parece usar para guardar dados em disco (DEC-41). Só sugerem.
          items:
            $ref: '#/components/schemas/PersistentSuggestion'
        warnings:
          type: array
          description: Avisos que nunca bloqueiam (por exemplo, credencial exposta no repositório).
          items:
            $ref: '#/components/schemas/Finding'
        evidences:
          type: array
          items:
            $ref: '#/components/schemas/Evidence'
        coverage:
          $ref: '#/components/schemas/Coverage'
    AppliedRule:
      type: object
      required: [id, version, state, status]
      properties:
        id:
          type: string
        version:
          type: string
        state:
          type: string
        status:
          type: string
        reason:
          type: string
    Origin:
      type: string
      description: |
        De onde veio o valor, em ordem decrescente de precedência. `platform` é
        um valor que a plataforma escolhe porque o repositório declara o
        contrato (o app lê `PORT`; DEC-35).
      enum: [override, declaration, platform, inference, default]
    Proposal:
      type: object
      required: [field, value, origin, rule]
      properties:
        field:
          type: string
        value:
          type: string
        origin:
          $ref: '#/components/schemas/Origin'
        rule:
          type: string
        evidence_ids:
          type: array
          items:
            type: string
    Field:
      type: object
      required: [value, origin]
      properties:
        value:
          type: string
        origin:
          $ref: '#/components/schemas/Origin'
        rules:
          type: array
          items:
            type: string
        evidence_ids:
          type: array
          items:
            type: string
        overrode:
          type: array
          description: Propostas que um override do usuário cobriu.
          items:
            $ref: '#/components/schemas/Proposal'
    Option:
      type: object
      required: [value]
      properties:
        value:
          type: string
        kind:
          type: string
          description: Inferência a partir do comando; apresente-a como tal.
          enum: [production, development]
        note:
          type: string
    Finding:
      type: object
      required: [message]
      properties:
        rule:
          type: string
        field:
          type: string
        message:
          type: string
        evidence_ids:
          type: array
          items:
            type: string
        options:
          type: array
          description: Valores que o usuário pode escolher; nunca aplicados sem escolha explícita.
          items:
            $ref: '#/components/schemas/Option'
        omitted:
          type: array
          description: O que a regra deixou de oferecer, para a interface mostrar tudo.
          items:
            type: string
    EnvReference:
      type: object
      required: [path, scope]
      properties:
        path:
          type: string
        scope:
          $ref: '#/components/schemas/Scope'
    Scope:
      type: string
      enum: [runtime, build, test, unknown]
    ConfigVariable:
      type: object
      required: [name, class, example, declared_in_example]
      properties:
        name:
          type: string
        class:
          type: string
          description: |
            `platform` (fornecida pelo Cobogó), `generable` (segredo que o app
            inventa; pode ser gerado sob ação do usuário) ou `user`.
          enum: [platform, generable, user, public]
        example:
          type: string
          description: Como aparece no arquivo de exemplo.
          enum: [absent, empty, placeholder, default, commented, exposed]
        default_value:
          type: string
          description: Só no estado `default` (valor não secreto).
        hint:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [likely_required, likely_optional, commented, prefilled, undeclared, referenced_only]
            message:
              type: string
        declared_in_example:
          type: boolean
        references:
          type: array
          items:
            $ref: '#/components/schemas/EnvReference'
        evidence_ids:
          type: array
          items:
            type: string
    Evidence:
      type: object
      required: [id, extractor, kind, source, scope]
      properties:
        id:
          type: string
        extractor:
          type: string
        kind:
          type: string
        name:
          type: string
        value:
          type: string
        source:
          type: string
        line:
          type: integer
        scope:
          $ref: '#/components/schemas/Scope'
    Coverage:
      type: object
      required: [files_read, gaps]
      properties:
        files_read:
          type: integer
        gaps:
          type: array
          items:
            type: object
            required: [path, reason]
            properties:
              path:
                type: string
              reason:
                type: string
