          description: O caminho do contêiner de um volume; ausente no banco.
        file:
          type: string
        size_bytes:
          type: integer
          format: int64
        sha256:
          type: string
    BackupManifest:
      type: object
      required: [version, project_id, project_slug, created_at, paused_app, reason, items]
      properties:
        version:
          type: integer
        project_id:
          type: string
        project_slug:
          type: string
        created_at:
          type: string
          format: date-time
        paused_app:
          type: boolean
        reason:
          type: string
        postgres_major:
          type: string
        items:
